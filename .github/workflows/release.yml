name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: oxide-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: oxide-aarch64-linux
            # pyrrhic-rs 0.2.0 declares strcpy as (*mut i8, *const i8), but
            # c_char is u8 on aarch64 Linux, so the crate does not compile for
            # this target. 0.2.0 is the newest published version, so this
            # artifact ships without Syzygy support until that is fixed
            # upstream. Every other target keeps the default features.
            cargo_flags: "--no-default-features --features host"
          - target: x86_64-apple-darwin
            os: macos-latest
            name: oxide-x86_64-macos
          - target: aarch64-apple-darwin
            os: macos-latest
            name: oxide-aarch64-macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: oxide-x86_64-windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        env:
          RUSTFLAGS: ""
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.cargo_flags }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/oxid ${{ matrix.name }}
          chmod +x ${{ matrix.name }}
          tar czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/oxid.exe ${{ matrix.name }}.exe
          7z a ${{ matrix.name }}.zip ${{ matrix.name }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*


  wasm:
    name: oxide-wasm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup target add wasm32-unknown-unknown

      - name: Resolve wasm-bindgen version
        id: bindgen
        run: |
          version=$(sed -n '/^name = "wasm-bindgen"$/,/^version = /s/^version = "\(.*\)"/\1/p' Cargo.lock | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache wasm-bindgen-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.bindgen.outputs.version }}

      - name: Install wasm-bindgen-cli
        run: |
          if ! command -v wasm-bindgen >/dev/null; then
            cargo install wasm-bindgen-cli --version ${{ steps.bindgen.outputs.version }} --locked
          fi

      # No RUSTFLAGS override here: .cargo/config.toml's
      # [target.wasm32-unknown-unknown] entry supplies -C target-feature=+simd128
      # and an env RUSTFLAGS would replace it wholesale.
      - name: Build wasm package
        run: ./scripts/build_wasm.sh

      - name: Smoke test in Node
        run: node wasm/harness.mjs

      - name: Package
        run: tar czf oxide-wasm.tar.gz -C pkg .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxide-wasm
          path: oxide-wasm.tar.gz

  release:
    needs: [build, wasm]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
