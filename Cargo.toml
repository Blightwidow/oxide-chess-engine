[package]
name = "oxid"
version = "1.3.0"
edition = "2021"

[lib]
name = "oxid"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "oxid"
path = "src/main.rs"
required-features = ["host"]

[features]
default = ["host", "tablebase"]
# Host-only subsystems: the stdin UCI loop, bench suite, EPD tester and self-play
# datagen. All of them assume a terminal and a real filesystem.
host = []
# Syzygy endgame tablebases. pyrrhic-rs links C sources, so there is no
# wasm32-unknown-unknown build for it.
tablebase = ["dep:pyrrhic-rs"]
# Browser build: exposes the wasm-bindgen shim in src/wasm.rs.
wasm = ["dep:wasm-bindgen"]

[dependencies]
arrayvec = "0.7.4"
pyrrhic-rs = { version = "0.2", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

# std::time::Instant::now() and SystemTime::now() panic on wasm32-unknown-unknown.
# web-time provides drop-in replacements backed by performance.now()/Date.now().
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1"

[profile.release]
lto = true
codegen-units = 1
